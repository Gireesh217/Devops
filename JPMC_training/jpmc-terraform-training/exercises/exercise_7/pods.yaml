apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: pod
  namespace: dev  
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: my-container
          image: nginx:latest
          ports:
            - containerPort: 80
 
 
 